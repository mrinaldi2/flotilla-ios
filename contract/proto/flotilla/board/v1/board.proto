// The board surface, contract version 1 (ADR-001 §1).
//
// The single source of truth: Rust (prost), TypeScript (protobuf-es) and
// Swift (swift-protobuf) are generated from this file. Additive changes keep
// the version; `buf breaking` failing means bump `hello_ok.contracts.board`.
// Requests, responses and pushes are in requests.proto.
syntax = "proto3";

package flotilla.board.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// The canonical category a column maps to. Guards and metrics key on it, so
// renaming or splitting a column never changes the rules.
enum ColumnCategory {
  COLUMN_CATEGORY_UNSPECIFIED = 0;
  COLUMN_CATEGORY_INBOX = 1;
  COLUMN_CATEGORY_READY = 2;
  COLUMN_CATEGORY_DOING = 3;
  COLUMN_CATEGORY_REVIEW = 4;
  COLUMN_CATEGORY_VERIFY = 5;
  COLUMN_CATEGORY_APPROVAL = 6;
  COLUMN_CATEGORY_DEPLOYING = 7;
  COLUMN_CATEGORY_DONE = 8;
  COLUMN_CATEGORY_CANCELLED = 9;
  // Between Ready and Doing (0.21.0): a task or bug's assignee reads the
  // code and records findings before it may start (guard `start.research`).
  COLUMN_CATEGORY_RESEARCH = 10;
}

// What a column means to the board itself: open (not started), active (WIP,
// staleness and cycle time apply), done or cancelled. Every other meaning
// comes from the column's rules.
enum ColumnKind {
  COLUMN_KIND_UNSPECIFIED = 0;
  COLUMN_KIND_OPEN = 1;
  COLUMN_KIND_ACTIVE = 2;
  COLUMN_KIND_DONE = 3;
  COLUMN_KIND_CANCELLED = 4;
}

// What a column's WIP limit counts.
enum WipScope {
  WIP_SCOPE_UNSPECIFIED = 0;
  WIP_SCOPE_COLUMN = 1;
  WIP_SCOPE_PER_ASSIGNEE = 2;
}

// A bot's role in a project's way of working.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_LEAD = 1;
  ROLE_COACH = 2;
  ROLE_DEVOPS = 3;
  ROLE_REVIEWER_ARCH = 4;
  ROLE_REVIEWER_UX = 5;
  ROLE_TESTER = 6;
  ROLE_DEV = 7;
  // Reviews security work: permissions, identity, peers, confinement (H-261 §2.1).
  ROLE_REVIEWER_CE = 8;
  // The on-demand team's SDLC roles (0.23.0, capability `team_on_demand_v1`):
  // Product shapes a card, Architect designs it; Dev builds and Tester
  // verifies. The lead may set both, as it sets Dev.
  ROLE_PRODUCT = 9;
  ROLE_ARCHITECT = 10;
}

// A card's type. From 0.21.0 (capability `item_types_v2`) cards are tasks,
// design tickets, bugs and spikes: features and epics live in the plan
// (plan.proto) and chores became tasks. A 0.21 home refuses creating or
// retyping a card to EPIC, FEATURE or CHORE (`new.type_retired`); the values
// stay so older homes and clients still decode.
enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_EPIC = 1;
  ITEM_TYPE_FEATURE = 2;
  ITEM_TYPE_BUG = 3;
  ITEM_TYPE_SPIKE = 4;
  ITEM_TYPE_CHORE = 5;
  // Build something; passes Research before Doing.
  ITEM_TYPE_TASK = 6;
  // Mockups or a spec. Done, it can be linked to the tasks that build it
  // (`LINK_KIND_DESIGN`).
  ITEM_TYPE_DESIGN = 7;
}

// Deprecated (0.19.0 K8): what 0.18 apps and linked computers read and
// send. An item's platforms are its labels in the `platform` group
// (`platform:ios`); a 0.19 home fills these fields from them and maps them
// back on input. Read `labels` instead.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_DESKTOP = 1;
  PLATFORM_IOS = 2;
  PLATFORM_DAEMON = 3;
  PLATFORM_INFRA = 4;
}

// L is allowed only in the inbox: it must be split before it is ready.
enum Size {
  SIZE_UNSPECIFIED = 0;
  SIZE_S = 1;
  SIZE_M = 2;
  SIZE_L = 3;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_P0 = 1;
  PRIORITY_P1 = 2;
  PRIORITY_P2 = 3;
  PRIORITY_P3 = 4;
}

// A bot's part on one item, beyond the assignee.
enum PersonRole {
  PERSON_ROLE_UNSPECIFIED = 0;
  PERSON_ROLE_REVIEWER = 1;
  PERSON_ROLE_VERIFIER = 2;
}

enum VerificationResult {
  VERIFICATION_RESULT_UNSPECIFIED = 0;
  VERIFICATION_RESULT_PASS = 1;
  VERIFICATION_RESULT_FAIL = 2;
  VERIFICATION_RESULT_BLOCKED = 3;
}

enum LinkKind {
  LINK_KIND_UNSPECIFIED = 0;
  LINK_KIND_TASK = 1;
  LINK_KIND_DECISION = 2;
  LINK_KIND_ARTIFACT = 3;
  LINK_KIND_BRANCH = 4;
  LINK_KIND_PR = 5;
  LINK_KIND_MEETING = 6;
  LINK_KIND_ITEM_BLOCKS = 7;
  LINK_KIND_ITEM_RELATES = 8;
  LINK_KIND_ITEM_DUPLICATES = 9;
  // A conversation about the item (0.19.0): the chat of a bot invited to
  // discuss it as a draft. `ref` is the bot's id.
  LINK_KIND_THREAD = 10;
  // The design ticket a task builds (0.21.0): `ref` is the Design card's id.
  // The task shows that card's documents.
  LINK_KIND_DESIGN = 11;
}

// What an item-history event records. Metrics are computed from these.
enum ItemEventKind {
  ITEM_EVENT_KIND_UNSPECIFIED = 0;
  ITEM_EVENT_KIND_CREATED = 1;
  ITEM_EVENT_KIND_MOVED = 2;
  ITEM_EVENT_KIND_EDITED = 3;
  ITEM_EVENT_KIND_COMMENTED = 4;
  ITEM_EVENT_KIND_LINKED = 5;
  ITEM_EVENT_KIND_ASSIGNED = 6;
  ITEM_EVENT_KIND_BLOCKED = 7;
  ITEM_EVENT_KIND_RANKED = 8;
  // A task delegated for the item was completed, expired or cancelled.
  ITEM_EVENT_KIND_TASK_DONE = 9;
  ITEM_EVENT_KIND_TASK_EXPIRED = 10;
  ITEM_EVENT_KIND_TASK_CANCELLED = 11;
  ITEM_EVENT_KIND_UNLINKED = 12;
}

enum TemplateKind {
  TEMPLATE_KIND_UNSPECIFIED = 0;
  TEMPLATE_KIND_ITEM_TYPE = 1;
  TEMPLATE_KIND_MEETING_TYPE = 2;
}

// Machines, as a map value (map values cannot be repeated).
message StringList {
  repeated string values = 1;
}

// One board of a project (0.19.0). A project has a default board; others
// are made with `board_create`.
message Board {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // The item-id prefix of the items created on it.
  string key = 4;
  string description = 5;
  uint32 ord = 6;
  bool is_default = 7;
  // "owner_confirms" or "lead_free": what a lead's structure change needs.
  string structure_policy = 8;
  // "custom" (the columns' movers and rules decide) or "release_gated".
  string flow = 9;
  // Fact name (`pr.merged`) to the column key a custom board moves to.
  map<string, string> automations = 10;
  bool archived = 11;
  uint64 version = 12;
  // The label groups the board declares, for filters and pickers. An item's
  // label `<group>:<value>` belongs to group `<group>`.
  repeated LabelGroup label_groups = 13;
}

// Labels that go together, such as `platform: ios, android` (0.19.0 K8).
message LabelGroup {
  // Lowercase, no spaces or colons: `platform`, `area`.
  string name = 1;
  // The values offered, in order: `web` stands for the label `platform:web`.
  repeated string values = 2;
}

// One project's board configuration.
message BoardSettings {
  string project_id = 1;
  // Item id prefix: "RB" gives "RB-12".
  string key = 2;
  // The next item number; ids are never reused.
  uint32 next_seq = 3;
  uint32 stale_after_hours = 4;
  // Deprecated (0.19.0 K8): `required_machines_by_label` for the labels of
  // the `platform` group a 0.18 reader knows, keyed by the bare name
  // ("desktop").
  map<string, StringList> required_machines = 5;
  // The daemon that holds the board; linked computers forward to it.
  string home_daemon_id = 6;
  uint64 version = 7;
  // Machines that must verify an item carrying the label, keyed by the
  // label (`platform:desktop`). Unset from a home older than 0.19: read
  // `required_machines`.
  map<string, StringList> required_machines_by_label = 8;
}

message BoardColumn {
  string project_id = 1;
  string key = 2;
  string name = 3;
  uint32 ord = 4;
  ColumnCategory category = 5;
  optional uint32 wip_limit = 6;
  WipScope wip_scope = 7;
  bool visible = 8;
  // The board it belongs to. Empty from a home older than 0.19.
  string board_id = 9;
  // Unset from a home older than 0.19: derive it from `category`.
  ColumnKind kind = 10;
  // A custom board's rules for entering the column, as tokens: movers
  // `any_member`, `assignee`, `lead`, `owner`, `system`, `roles:dev,tester`
  // (none: any member); rules `assignee_set`, `fields_filled:Goal;Steps`,
  // `ac_present`, `ac_all_checked`, `size_at_most:M`, `blockers_done`,
  // `not_blocked`, `link:pr`, `independent`, `reason`, `predicate:<name>`;
  // `allowed_from` column keys (none: any).
  repeated string movers = 11;
  repeated string rules = 12;
  repeated string allowed_from = 13;
}

message ProjectRole {
  string project_id = 1;
  Role role = 2;
  string bot_id = 3;
  // The machine a tester verifies on.
  optional string machine = 4;
}

// Set while an item is blocked: a flag, not a column.
message Blocked {
  // The blocking item, when it is one.
  optional string by = 1;
  string reason = 2;
  google.protobuf.Timestamp since = 3;
}

message AcceptanceCriterion {
  uint32 idx = 1;
  string text = 2;
  bool checked = 3;
  optional string checked_by = 4;
  optional google.protobuf.Timestamp checked_at = 5;
  // Where it was checked, for platform criteria.
  optional string machine = 6;
  // Provable only once installed (H-116): release_submit leaves it open,
  // and the item can't reach Done (nor the last deploy_confirm pass) until
  // it is checked.
  bool post_install = 7;
}

message ItemPerson {
  string bot_id = 1;
  PersonRole role = 2;
}

message ItemVerification {
  string machine = 1;
  VerificationResult result = 2;
  string by = 3;
  google.protobuf.Timestamp at = 4;
  optional string note = 5;
}

// A work item in full, as the item drawer shows it.
message Item {
  // "RB-12"; immutable.
  string id = 1;
  uint32 seq = 2;
  ItemType type = 3;
  string title = 4;
  // Markdown, filled from the type's template.
  string description = 5;
  // Deprecated (0.19.0 K8): filled from `labels` for 0.18 readers.
  repeated Platform platforms = 6;
  optional Size size = 7;
  Priority priority = 8;
  // Fractional-index key: order within the backlog.
  string rank = 9;
  string column_key = 10;
  ColumnCategory category = 11;
  optional Blocked blocked = 12;
  optional string assignee = 13;
  optional string parent_id = 14;
  optional string release_id = 15;
  // Free labels; `<group>:<value>` ones belong to a board's label group.
  repeated string labels = 16;
  repeated AcceptanceCriterion acceptance_criteria = 17;
  repeated ItemPerson people = 18;
  repeated ItemVerification verifications = 19;
  string created_by = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  google.protobuf.Timestamp state_entered_at = 23;
  optional google.protobuf.Timestamp done_at = 24;
  // Optimistic concurrency: every mutation names the version it read.
  uint64 version = 25;
  // The board it is on. Empty from a home older than 0.19.
  string board_id = 26;
  // "draft" (on no column yet: seen only by the owner and the bots invited
  // to discuss it), "live", or "discarded" (a draft the owner dropped, kept
  // with its history). Empty from a home older than 0.19, which means live.
  string state = 27;
  // The plan node it belongs to (0.21.0): a spike or design ticket of an
  // initiative or epic in research, or a task of a feature.
  optional string plan_node_id = 28;
}

// The compact form a board column lists; the drawer fetches the Item.
message ItemCard {
  string id = 1;
  ItemType type = 2;
  string title = 3;
  Priority priority = 4;
  optional Size size = 5;
  string rank = 6;
  string column_key = 7;
  optional string assignee = 8;
  // Deprecated (0.19.0 K8): filled from `labels` for 0.18 readers.
  repeated Platform platforms = 9;
  // Free labels; `<group>:<value>` ones belong to a board's label group.
  repeated string labels = 10;
  bool blocked = 11;
  bool stale = 12;
  uint32 ac_checked = 13;
  uint32 ac_total = 14;
  uint64 version = 15;
  // The owner's latest comment on it (H-211): a computer mirroring the board
  // closes its card questions asked before it.
  google.protobuf.Timestamp owner_commented_at = 16;
  // The board it is on. Empty from a home older than 0.19.
  string board_id = 17;
  // A draft's card, for the owner's drafts tray. Drafts are never in a
  // column's cards.
  bool draft = 18;
  // A draft's invited bots, by id, so the owner's tray and drawer follow an
  // invitation or its removal live. Empty on a live card.
  repeated string invited = 19;
  // Why the card can't move on (0.19.0): its last move was refused, or the
  // next column's rules stop it. Absent when nothing does, and from a home
  // older than 0.19.0's card-flow fix.
  optional MoveBlock move_block = 20;
  // The plan node it belongs to (0.21.0).
  optional string plan_node_id = 21;
  // Open questions for the owner on the card (0.22.0).
  uint32 questions_open = 22;
}

// What stops a card, for its "can't move" line. Computed when the card is
// read; nothing is stored.
message MoveBlock {
  // The column it can't move to.
  string to_column = 1;
  // The first unmet rule's text.
  string reason = 2;
  // How many other rules are unmet.
  uint32 more = 3;
  // A move was tried and refused (true), or the next column's rules would
  // refuse it (false).
  bool refused = 4;
}

message ItemLink {
  string item_id = 1;
  LinkKind kind = 2;
  // What the link points at: a task id, a branch name, another item id…
  string ref = 3;
  optional string label = 4;
  string created_by = 5;
  google.protobuf.Timestamp at = 6;
}

// What an item carries for the work (0.19.0): a screenshot, a file or a
// linked document. An image can sit in the description as
// `![caption](attachment:<id>)`.
message ItemAttachment {
  string id = 1;
  string item_id = 2;
  // "image", "file" or "doc" (a project artifact or an external URL).
  string kind = 3;
  string name = 4;
  string mime = 5;
  uint64 bytes = 6;
  // Of the stored bytes; empty for a doc. Linked computers cache by it.
  string sha256 = 7;
  // Where the board's home keeps it: an image's or a file's stored copy, or
  // a doc's artifact. Empty for a URL.
  string path = 8;
  string url = 9;
  string caption = 10;
  // The actor as stored: `user`, `bot:<id>` or `device:<id>`.
  string added_by = 11;
  google.protobuf.Timestamp at = 12;
  // Detached. Kept so that a reference to it shows a placeholder.
  bool removed = 13;
}

// One change to a draft, with its author (0.19.0).
message DraftRevision {
  int64 id = 1;
  string item_id = 2;
  // The actor as stored: `user`, `bot:<id>` or `device:<id>`.
  string actor = 3;
  google.protobuf.Timestamp at = 4;
  // What changed: "title", "description", "type", "size", "priority",
  // "labels", "acceptance_criteria", "attachment" or "link".
  string field = 5;
  optional string from = 6;
  optional string to = 7;
}

message ItemComment {
  string id = 1;
  string item_id = 2;
  string author = 3;
  string body = 4;
  optional string reply_to = 5;
  google.protobuf.Timestamp at = 6;
}

// One append-only history entry.
message ItemEvent {
  int64 id = 1;
  string item_id = 2;
  google.protobuf.Timestamp at = 3;
  // The actor as stored: `user`, `bot:<id>` or `device:<id>`.
  string actor = 4;
  ItemEventKind kind = 5;
  optional string from = 6;
  optional string to = 7;
  optional string field = 8;
  optional string note = 9;
}

message Template {
  string project_id = 1;
  TemplateKind kind = 2;
  string name = 3;
  uint32 version = 4;
  // Sections and required fields; its shape is the template's own.
  google.protobuf.Struct body = 5;
}

// A guard a move does not meet yet, with what would fix it. The UI shows these
// texts as they are and never re-implements a rule.
message Unmet {
  string code = 1;
  string text = 2;
  optional string fix = 3;
}
