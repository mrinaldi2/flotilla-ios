name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lens:
    name: Gravity Lens
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile companion/gravity_lens.py companion/gravity_files.py companion/gravity_autostart.py demo/make_demo.py demo/fake_screen.py
      - run: python -m unittest discover tests -v

  lens-windows:
    name: Gravity Lens on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -p "test_[flw]*.py" -v
      - name: The installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\companion\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }

  app:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Wire contract is current
        # Vendored protos match their checksums in contract/SOURCE, and the
        # committed Swift matches the protos (ADR-001).
        run: scripts/contract/generate-swift.sh --check
      - name: Build for the simulator
        run: |
          xcodebuild -project Flotilla.xcodeproj -scheme Flotilla \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
          test ${PIPESTATUS[0]} -eq 0
      - name: Unit tests
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -project Flotilla.xcodeproj -scheme Flotilla \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)"
          test ${PIPESTATUS[0]} -eq 0
